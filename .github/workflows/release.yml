name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    env:
      DOTNET_VERSION: 10.0.x
      PROJECT_PATH: src/TwitchArchivist/TwitchArchivist.csproj
      PUBLISH_RUNTIME: win-x64
      PUBLISH_CONFIGURATION: Release
      PUBLISH_DIRECTORY: ${{ github.workspace }}\artifacts\publish

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore TwitchArchivist.slnx

      - name: Run tests
        run: dotnet test TwitchArchivist.slnx --configuration $env:PUBLISH_CONFIGURATION --no-restore

      - name: Determine next release tag
        id: version
        shell: pwsh
        run: |
          git fetch --force --tags origin

          $latestTag = git tag --list "v*" --sort=-v:refname | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($latestTag)) {
              $nextVersion = "0.1.0"
          }
          else {
              if ($latestTag -notmatch '^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$') {
                  throw "Latest tag '$latestTag' does not match the expected v<major>.<minor>.<patch> format."
              }

              $major = [int]$Matches.major
              $minor = [int]$Matches.minor
              $patch = [int]$Matches.patch + 1
              $nextVersion = "$major.$minor.$patch"
          }

          $releaseTag = "v$nextVersion"
          $archiveName = "TwitchArchivist-$releaseTag-win-x64.zip"
          $assemblyVersion = "$nextVersion.0"

          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "release_version=$nextVersion" >> $env:GITHUB_OUTPUT
          "assembly_version=$assemblyVersion" >> $env:GITHUB_OUTPUT
          "archive_name=$archiveName" >> $env:GITHUB_OUTPUT

      - name: Publish application bundle
        shell: pwsh
        run: |
          dotnet publish $env:PROJECT_PATH `
            --configuration $env:PUBLISH_CONFIGURATION `
            --runtime $env:PUBLISH_RUNTIME `
            --self-contained true `
            --output $env:PUBLISH_DIRECTORY `
            -p:Version=${{ steps.version.outputs.release_version }} `
            -p:AssemblyVersion=${{ steps.version.outputs.assembly_version }} `
            -p:FileVersion=${{ steps.version.outputs.assembly_version }} `
            -p:InformationalVersion=${{ steps.version.outputs.release_tag }}+${{ github.sha }}

      - name: Render README as standalone HTML
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          PUBLISH_DIRECTORY: ${{ env.PUBLISH_DIRECTORY }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const markdown = fs.readFileSync("README.md", "utf8");
            const response = await github.request("POST /markdown", {
              text: markdown,
              mode: "gfm",
              context: process.env.GITHUB_REPOSITORY
            });

            const releaseTag = process.env.RELEASE_TAG;
            const outputDirectory = process.env.PUBLISH_DIRECTORY;
            fs.mkdirSync(outputDirectory, { recursive: true });

            const html = `<!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>TwitchArchivist README ${releaseTag}</title>
              <style>
                :root {
                  color-scheme: light dark;
                  font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
                  line-height: 1.55;
                }
                body {
                  margin: 0;
                  padding: 2rem;
                  background: #0d1117;
                  color: #e6edf3;
                }
                main {
                  max-width: 960px;
                  margin: 0 auto;
                }
                article {
                  background: #161b22;
                  border: 1px solid #30363d;
                  border-radius: 12px;
                  padding: 2rem;
                  box-shadow: 0 20px 45px rgba(0, 0, 0, 0.18);
                }
                a { color: #58a6ff; }
                code, pre { font-family: "Cascadia Code", Consolas, monospace; }
                pre {
                  overflow-x: auto;
                  padding: 1rem;
                  background: #0d1117;
                  border-radius: 8px;
                }
                table {
                  border-collapse: collapse;
                  width: 100%;
                }
                th, td {
                  border: 1px solid #30363d;
                  padding: 0.5rem 0.75rem;
                  text-align: left;
                }
                blockquote {
                  margin-left: 0;
                  padding-left: 1rem;
                  border-left: 4px solid #30363d;
                  color: #9da7b3;
                }
                img {
                  max-width: 100%;
                  height: auto;
                }
                .meta {
                  margin-bottom: 1.5rem;
                  color: #9da7b3;
                  font-size: 0.95rem;
                }
              </style>
            </head>
            <body>
              <main>
                <article>
                  <div class="meta">Embedded release documentation for ${releaseTag}</div>
                  ${response.data}
                </article>
              </main>
            </body>
            </html>`;

            fs.writeFileSync(path.join(outputDirectory, "README.html"), html, "utf8");

      - name: Archive published files
        id: archive
        shell: pwsh
        run: |
          $archivePath = Join-Path $env:GITHUB_WORKSPACE ${{ steps.version.outputs.archive_name }}
          if (Test-Path -LiteralPath $archivePath) {
              Remove-Item -LiteralPath $archivePath -Force
          }

          Compress-Archive -Path (Join-Path $env:PUBLISH_DIRECTORY '*') -DestinationPath $archivePath
          "archive_path=$archivePath" >> $env:GITHUB_OUTPUT

      - name: Create GitHub release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.release_tag }}" "${{ steps.archive.outputs.archive_path }}" `
            --target "${{ github.sha }}" `
            --title "${{ steps.version.outputs.release_tag }}" `
            --generate-notes
